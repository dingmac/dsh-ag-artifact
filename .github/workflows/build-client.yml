name: build-client

on:
  push:
    paths:
      - 'client/**'
      - 'lib/core/**'
      - 'scripts/build-client.mjs'
      - 'package.json'
      - '.github/workflows/build-client.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build browser bundle
        run: node scripts/build-client.mjs
      - name: Verify sources and bundle contract
        id: verify
        continue-on-error: true
        run: |
          for f in lib/*.js lib/core/*.js scripts/*.mjs; do node --check "$f"; done
          node scripts/check-client.mjs
      - name: Normalize text endings
        run: |
          perl -0pi -e 's/\n*\z/\n/' lib/tools.js
          perl -0pi -e 's/\n+\z//' package.json
      - name: Record verification status
        run: |
          mkdir -p .ci
          if [ "${{ steps.verify.outcome }}" = "success" ]; then
            printf '{\n  "ok": true,\n  "at": "%s"\n}\n' "$(date -u +%FT%TZ)" > .ci/verify.json
          else
            printf '{\n  "ok": false,\n  "at": "%s"\n}\n' "$(date -u +%FT%TZ)" > .ci/verify.json
          fi
      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/client.js lib/tools.js package.json .ci/verify.json
          if git diff --cached --quiet; then
            echo "generated files are up to date"
          else
            git commit -m "build: regenerate lib/client.js"
            git push
          fi
